name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        # The remaining older cart/products suites under apps/*/tests/ still
        # target removed APIs and fields; add them here as they are updated.
        run: >
          pytest -q
          apps/accounts/tests.py
          apps/orders/
          apps/cart/tests/test_cart_api.py
          apps/cart/tests/test_cart_middleware_integration.py
          apps/cart/tests/integration/test_context_processors.py
          apps/cart/tests/unit/test_serializers.py
          apps/products/tests/test_catalog_filters.py
          apps/products/tests/test_admin_catalog.py
          apps/content/tests.py
          apps/core/test_seo.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  e2e:
    # The built storefront served by Django with production settings, driven
    # by a real browser (frontend/e2e).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r ../backend/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the storefront
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    # The production image (see DEPLOY.md) still builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg VITE_SITE_URL=https://www.example.de -t backlover:ci .
